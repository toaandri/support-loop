name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: supportloop_test
          POSTGRES_USER: supportloop
          POSTGRES_PASSWORD: supportloop
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U supportloop -d supportloop_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://supportloop:supportloop@localhost:5432/supportloop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm run setup
      - run: npm run check
      - run: npm run evaluate
      - run: npm audit --prefix backend --audit-level=high
      - run: npm audit --prefix frontend --audit-level=high
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: supportloop_test
          POSTGRES_USER: supportloop
          POSTGRES_PASSWORD: supportloop
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U supportloop -d supportloop_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://supportloop:supportloop@localhost:5432/supportloop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run setup
      - run: python -m pip install -r scripts/media-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:portal
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-logs
          path: |
            .superpowers/browser-check/*.log
            .superpowers/portal-check/*.log
          include-hidden-files: true
