services:
  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 3000
      AGENT_MODE: ${AGENT_MODE:-demo}
      STORAGE_MODE: ${STORAGE_MODE:-postgres}
      DEMO_MODE: ${DEMO_MODE:-true}
      CUSTOMER_API_KEY: ${CUSTOMER_API_KEY:-}
      SUPPORT_ADMIN_KEY: ${SUPPORT_ADMIN_KEY:-}
      SUPPORT_CUSTOMER_ID: ${SUPPORT_CUSTOMER_ID:-customer-demo}
      SUPPORT_AGENT_NAME: ${SUPPORT_AGENT_NAME:-Support}
      DATABASE_URL: postgresql://supportloop:supportloop@postgres:5432/supportloop
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.35}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - ./database:/database:ro
      - ./knowledge:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: supportloop
      POSTGRES_USER: supportloop
      POSTGRES_PASSWORD: supportloop
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-knowledge.sql:ro
      - ./database/support-schema.sql:/docker-entrypoint-initdb.d/002-support.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/003-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportloop -d supportloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    environment:
      SUPPORT_LOOP_BACKEND_URL: http://backend:3000
      CUSTOMER_API_KEY: ${CUSTOMER_API_KEY:-}
      N8N_SECURE_COOKIE: false
    ports:
      - "5678:5678"
    volumes:
      - ./n8n/workflows:/workflows
    depends_on:
      - backend

volumes:
  postgres_data:
