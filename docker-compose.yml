services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      AGENT_MODE: ${AGENT_MODE:-demo}
      STORAGE_MODE: postgres
      DEMO_MODE: ${DEMO_MODE:-true}
      CUSTOMER_API_KEY: ${CUSTOMER_API_KEY:-}
      SUPPORT_ADMIN_KEY: ${SUPPORT_ADMIN_KEY:-}
      SUPPORT_CUSTOMER_ID: ${SUPPORT_CUSTOMER_ID:-customer-demo}
      SUPPORT_AGENT_NAME: ${SUPPORT_AGENT_NAME:-Support}
      DATABASE_URL: postgresql://supportloop:${POSTGRES_PASSWORD:-supportloop}@postgres:5432/supportloop
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.35}
      KNOWLEDGE_DIRECTORY: /knowledge/demo
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./knowledge:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: supportloop
      POSTGRES_USER: supportloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportloop}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-knowledge.sql:ro
      - ./database/support-schema.sql:/docker-entrypoint-initdb.d/002-support.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/003-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportloop -d supportloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:2
    profiles: ["automation"]
    restart: unless-stopped
    environment:
      SUPPORT_LOOP_BACKEND_URL: http://backend:3000
      CUSTOMER_API_KEY: ${CUSTOMER_API_KEY:-}
      SUPPORT_ADMIN_KEY: ${SUPPORT_ADMIN_KEY:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Paris}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
